<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background disc -->
  <circle cx="400" cy="400" r="380" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>
  <circle cx="400" cy="400" r="340" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Concentric geometric rings -->
  <circle cx="400" cy="400" r="290" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="12 4"/>

  <!-- Hexagonal frame -->
  <polygon points="400,180 590,290 590,510 400,620 210,510 210,290" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  <polygon points="400,210 564,305 564,495 400,590 236,495 236,305" fill="#0f172a" fill-opacity="0.5" stroke="#1e293b" stroke-width="2"/>

  <!-- Core central emblem (Reverse Engineering + Support Hours Manager) -->
  <g filter="url(#glow)">
    <circle cx="400" cy="400" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8" stroke-dasharray="40 10 15 10"/>
    <circle cx="400" cy="400" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9" stroke-dasharray="25 15 5 15"/>

    <path d="M 400 280 L 400 400 L 485 450" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="400" cy="400" r="16" fill="#f59e0b" stroke="#0f172a" stroke-width="4"/>
    
    <circle cx="400" cy="240" r="7" fill="#38bdf8"/>
    <circle cx="540" cy="400" r="7" fill="#38bdf8"/>
    <circle cx="400" cy="560" r="7" fill="#38bdf8"/>
    <circle cx="260" cy="400" r="7" fill="#38bdf8"/>
    
    <circle cx="499" cy="301" r="5" fill="#f59e0b"/>
    <circle cx="499" cy="499" r="5" fill="#f59e0b"/>
    <circle cx="301" cy="499" r="5" fill="#f59e0b"/>
    <circle cx="301" cy="301" r="5" fill="#f59e0b"/>
  </g>

  <!-- Fine tick marks around perimeter -->
  <g stroke="#64748b" stroke-width="1.5" opacity="0.5">
    <line x1="400" y1="30" x2="400" y2="50"/>
    <line x1="400" y1="750" x2="400" y2="770"/>
    <line x1="30" y1="400" x2="50" y2="400"/>
    <line x1="750" y1="400" x2="770" y2="400"/>
  </g>
</svg>
