server {
    listen 80;
    server_name shm.andrelsouza.dev.br localhost;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Static files do Django (Admin, DRF Spectacular, etc.)
    location ^~ /static/ {
        alias /usr/share/nginx/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files do Django (Uploads, extratos PDF, contratos, branding)
    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy para Backend API
    location /api/ {
        proxy_pass http://shm_prod_backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Proxy para Django Admin
    location /admin/ {
        proxy_pass http://shm_prod_backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Assets estáticos da SPA React
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
